<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Screen Capture settings</title>
  <style>
    :root {
      --bg: #f3f3f5;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b72;
      --border: #dcdce0;
      --accent: #d6246e;
      --button: #ececef;
      --button-hover: #e0e0e4;
      --ok: #1b7f3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a;
        --surface: #202024;
        --text: #ececef;
        --muted: #9a9aa3;
        --border: #34343a;
        --accent: #e8467f;
        --button: #2c2c32;
        --button-hover: #37373e;
        --ok: #5cc27d;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 20px; }

    .card {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
    .setting label { font-weight: 600; }
    .control { display: flex; align-items: center; gap: 8px; }
    input {
      width: 100px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .unit { color: var(--muted); }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

    footer { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--button);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--button-hover); }
    #saved { color: var(--ok); opacity: 0; transition: opacity .2s; }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1>Screen Capture settings</h1>

    <section class="card">
      <div class="setting">
        <label for="delay">Settle delay</label>
        <div class="control">
          <input id="delay" type="number" min="0" max="5000" step="50">
          <span class="unit">ms</span>
        </div>
      </div>
      <p class="hint">
        How long to wait after each scroll step before taking a screenshot (0 to 5000 ms, default 350).
        Raise it for virtualized lists and chat apps that render rows lazily, if the capture shows blank or missing rows.
        Lower it to make captures faster on simple pages.
      </p>
    </section>

    <footer>
      <button id="reset">Reset to default</button>
      <span id="saved" role="status">Saved</span>
    </footer>
  </main>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
