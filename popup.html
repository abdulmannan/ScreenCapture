<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenCapture</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #fff;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
    h1 { font-size: 14px; margin: 0; }
    #start {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: #d6246e;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #start:hover { background: #b81d5e; }
    #start:disabled { opacity: 0.6; cursor: default; }
    #settings {
      display: grid; place-items: center;
      width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 6px;
      background: transparent; color: #6b6b72;
      cursor: pointer;
    }
    #settings:hover { background: #ececef; color: #1d1d1f; }
    #status { margin: 10px 0 0; color: #b00020; font-size: 12px; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>ScreenCapture</h1>
    <button id="settings" title="Settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <button id="start">Pick element to capture</button>

  <p id="status"></p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
